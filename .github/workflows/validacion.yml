# Nombre visible en la pestaña Actions
name: Validación basica

#Se actica al enviar cambios a main
on:
  push:
    branches:
      - main

jobs:
  validar:
    #Runner temporal administrado por GH
    runs-on: ubuntu-latest
    
    steps:
      # Descarga el repositorio dentro del runner
      - name: Descargar código
        uses: actions/checkout@v7

      # Ejecuta varios comandos Bash
      - name: Mostrar información
        run: |
          echo "Repositorio $GITHUB_REPOSITORY"
          echo "Rama: $GITHUB_REF_NAME"
          echo "Usuario del runner:"
          whoami
    
      # Comprueba que exista un archivo
      - name: Validar README
        run: |
          test -f README.md
          echo "README.md encontrado correctamente"